[package]
name = "termusic-lib"
description = "library to support termusic."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true


[lib]
name = "termusiclib"
path = "src/lib.rs"
doctest = false


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
ahash.workspace = true
anyhow.workspace = true
thiserror.workspace = true
bytes.workspace = true
bytesize.workspace = true
chrono.workspace = true
dirs.workspace = true
id3.workspace = true
indoc.workspace = true
image.workspace = true
include_dir.workspace = true
log.workspace = true
lofty.workspace = true
opml.workspace = true
parking_lot.workspace = true
quick-xml.workspace = true
rand.workspace = true
regex.workspace = true
rfc822_sanitizer.workspace = true
rss.workspace = true
rusqlite.workspace = true
sanitize-filename.workspace = true
semver.workspace = true
serde.workspace = true
serde_content_ref.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
shellexpand.workspace = true
toml.workspace = true
tuirealm.workspace = true
unicode-segmentation.workspace = true
viuer.workspace = true
walkdir.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
lru.workspace = true
either.workspace = true

# reqwest's default TLS backend (rustls + aws-lc-rs) needs to compile aws-lc-sys's C/assembly,
# whose build script auto-detects an Android-NDK-style layout that Termux's own (non-NDK) clang
# doesn't follow — this reliably breaks there whenever Termux's clang packaging drifts. Android
# uses native-tls (Termux's own properly-packaged OpenSSL) instead; every other target keeps the
# workspace default. Keep the version below in sync with the `reqwest` entry in the root
# Cargo.toml's `[workspace.dependencies]`.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "cookies", "gzip", "json", "stream", "query",
    "charset", "http2", "system-proxy",
    "native-tls",
] }

[build-dependencies]
tonic-prost-build.workspace = true


[features]
default = ["config-v1-compat"]
config-v1-compat = []

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
