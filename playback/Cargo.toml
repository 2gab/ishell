[package]
name = "termusic-playback"
description = "playback library to support termusic."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true


[lib]
name = "termusicplayback"
path = "src/lib.rs"
doctest = false


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
termusic-lib.workspace = true
alphanumeric-sort.workspace = true
anyhow.workspace = true
async-trait.workspace = true
async-ringbuf.workspace = true
discord-rich-presence.workspace = true
glib = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true}
libmpv-sirno = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
pathdiff.workspace = true
rand.workspace = true
soundtouch = { workspace = true, optional = true }
rustfft.workspace = true
souvlaki.workspace = true
symphonia.workspace = true
symphonia-adapter-libopus = { workspace = true, optional = true }
rodio.workspace = true
tokio.workspace = true
# soundtouch= { git = 'https://github.com/Drewol/soundtouch-rs.git' }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_LibraryLoader",
	"Win32_UI_WindowsAndMessaging"
] }
symphonia-adapter-libopus = { workspace = true, optional = true, features = ["bundled"]}

# See the matching comment in lib/Cargo.toml: aws-lc-sys (reqwest's default TLS backend) doesn't
# build reliably against Termux's clang, so Android uses native-tls instead. Keep the versions
# below in sync with the `reqwest`/`stream-download` entries in the root Cargo.toml's
# `[workspace.dependencies]`. `stream-download` needs the same treatment separately — it pulls
# in its own `reqwest` dependency with its own TLS feature choice, unaffected by the override
# above.
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest.workspace = true
stream-download.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "cookies", "gzip", "json", "stream", "query",
    "charset", "http2", "system-proxy",
    "native-tls",
] }
stream-download = { version = "0.24.1", default-features = false, features = [
    "reqwest", "temp-storage", "reqwest-native-tls",
] }
# used by the "termux" backend to parse `termux-volume`'s JSON output
serde_json.workspace = true

[features]
# NOTE: do NOT enable any backends here, enable them in crate "server"!
# otherwise you will not be able to start that backend
default = []
# cover = []
gst = ["dep:gstreamer", "dep:glib"]
mpv = ["dep:libmpv-sirno"]
rusty-soundtouch = ["dep:soundtouch"]
rusty-libopus = ["dep:symphonia-adapter-libopus"]
all-backends = ["gst", "mpv"]


[dev-dependencies]
pretty_assertions.workspace = true
criterion.workspace = true
assert_fs.workspace = true
predicates.workspace = true
indoc.workspace = true

[lints]
workspace = true

[[bench]]
name = "async_ring"
harness = false
